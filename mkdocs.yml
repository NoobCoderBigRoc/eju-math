site_name: EJU数学Wiki
site_description: 面向海外留学生的日本留学试验（EJU）数学知识库 —— 参照 OI Wiki 的组织方式构建
site_author: EJU Math Project
copyright: Copyright &copy; 2026 EJU Math Project
# GitHub Pages 项目页地址（如改用自定义域名请修改此处）
site_url: https://noobcoderbigroc.github.io/eju-math/

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  icon:
    logo: material/function-variant

plugins:
  - search:
      separator: '[\s\u200b\-]'

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: "#"
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true

# KaTeX：CSS 必须显式引入，否则公式无样式
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/track.js

# 访问统计采集地址（analytics/server.py 部署后的公网地址）
# 留空则不埋点，适合本地开发；部署后改成实际地址再重新构建
extra:
  analytics_endpoint: ""

