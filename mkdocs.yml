site_name: EJU 数学知識庫
site_description: 日本留学試験（EJU）数学の体系的知識庫 —— OI Wiki の組織方式を参照して構築
site_author: EJU Math Project
copyright: Copyright &copy; 2026 EJU Math Project
# GitHub Pages 项目页地址（如改用自定义域名请修改此处）
site_url: https://noobcoderbigroc.github.io/eju-math/

theme:
  name: material
  language: ja
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える
  icon:
    logo: material/function-variant

plugins:
  - search:
      separator: '[\s\u200b\-]'

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: "#"
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true

# KaTeX：CSS 必须显式引入，否则公式无样式
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/track.js

# 访问统计采集地址（analytics/server.py 部署后的公网地址）
# 留空则不埋点，适合本地开发；部署后改成实际地址再重新构建
extra:
  analytics_endpoint: ""

nav:
  - 首页: index.md
  - 考试总览:
      - exam/index.md
      - 出题范围（考纲对照）: exam/syllabus.md
      - 备考策略: exam/strategy.md
      - 公式速查: cheatsheet.md
  - コース1（項目 1〜7）:
      - course1/index.md
      - 1. 数と式: course1/numbers.md
      - 2. 集合と命題: course1/sets.md
      - 3. 2次関数: course1/quadratic.md
      - 4. 図形と計量: course1/measure.md
      - 5. 場合の数と確率: course1/probability.md
      - 6. 整数の性質: course1/integer.md
      - 7. 図形の性質: course1/geometry.md
      - 補充 データの分析: course1/data.md
  - コース2（項目 8〜20）:
      - course2/index.md
      - 8. いろいろな式: course2/polynomials.md
      - 9. 図形と方程式: course2/geometry-equation.md
      - 10. 指数関数・対数関数: course2/explog.md
      - 11. 三角関数: course2/trig.md
      - 12. 数列: course2/sequence.md
      - 13. 確率分布: course2/probability-distribution.md
      - 14. ベクトル: course2/vector.md
      - 15. 複素数平面: course2/complex.md
      - 16. 式と曲線: course2/curves.md
      - 17. 関数: course2/functions.md
      - 18. 極限: course2/limits.md
      - 19. 微分法: course2/differentiation.md
      - 20. 積分法: course2/integration.md
