{% extends "base.html" %}

{#
  注入统计采集地址。
  在 mkdocs.yml 中配置：
    extra:
      analytics_endpoint: "https://stats.example.com"
  留空则不下发 meta，埋点脚本自动禁用。
#}
{% block extrahead %}
  {{ super() }}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EJU数学Wiki">
  <meta property="og:title" content="{{ page.title }} · EJU数学Wiki">
  <meta property="og:description" content="参照 OI Wiki 组织方式的 EJU（日本留学试验）数学知识库：JASSO 官方考纲 20 项目全覆盖，中文讲解 × 日语术语。">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="https://noobcoderbigroc.github.io/eju-math/images/og.png">
  <meta name="twitter:card" content="summary_large_image">
  {% if config.extra.analytics_endpoint %}
  <meta name="analytics-endpoint" content="{{ config.extra.analytics_endpoint }}">
  {% endif %}
{% endblock %}
